---
- name: Download NetBox tarball
  get_url:
    url: "{{ netbox_stable_uri }}"
    dest: /tmp/netbox.tar.gz
    validate_certs: "{{ netbox_download_validate_certs }}"

- name: Extract NetBox
  unarchive:
    src: /tmp/netbox.tar.gz
    dest: "{{ netbox_releases_path }}"
    creates: "{{ netbox_stable_path }}"
    owner: "{{ netbox_user }}"
    group: "{{ netbox_group }}"
    remote_src: true

- name: Symlink stable release to current NetBox directory
  file:
    src: "{{ netbox_stable_path }}"
    dest: "{{ netbox_current_path }}"
    owner: "{{ netbox_user }}"
    group: "{{ netbox_group }}"
    state: link
  notify:
    - reload netbox.service
